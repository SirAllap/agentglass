<!doctype html><html lang="en"><meta charset="utf-8">
<!-- The share card's source. `bun scripts/capture-og.ts` renders this page at
     1280x640 and writes landing/og.png: the og:image, the twitter:image and
     the repository's social preview. It is a page only so a headless browser
     can draw it; nobody is meant to land here.

     1280x640 is GitHub's social-preview size and exactly 2:1, which is also
     the crop X applies to a large card, so one picture serves all three. At the
     width a chat shows it (about 400px) the paragraph is texture; the
     headline, the mark and the tools in orbit around it are what read. The
     outermost pill sits on the 64px margin, so no unfurl crops a word.

     The tools are drawn, not captured. A frame of the real app goes stale the
     week a panel changes, and at thumbnail size it reads as a screen of
     numbers. The mark and the wordmark are the landing header's; the moons
     are parked where its animation has them two seconds in.

     Fonts: JetBrains Mono from web/node_modules, which the web app already
     depends on, and Inter from Google Fonts, so a render needs the network.
     The landing's own body stack names Inter; the machine's fallback sans
     would move every line break. -->

.ic{width:1em;height:1em;flex:none}

.mk{position:absolute;left:269px;top:195px;width:270px;height:270px;overflow:visible}
.nd{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;padding:9px 15px 9px 11px;border-radius:999px;background:#151126;border:1.5px solid rgba(167,139,250,.4);font-size:20px;font-weight:500;color:var(--txt);white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.8)}
.nd .ic{font-size:20px;color:var(--vio)}.nd.bk{opacity:.55;transform:translate(-50%,-50%) scale(.9)}
.copy{position:absolute;left:776px;right:64px;top:128px}
.copy .lk{font-size:30px}
h1{margin-top:44px;font-size:68px}
p{margin-top:22px;font-size:24px;max-width:19em;text-wrap:pretty}
</style>
