name: Deploy landing + demo to GitHub Pages

# Publishes the static landing page (landing/) at the site root and the
# web UI built in demo mode (VITE_DEMO=1 → fabricated data, no server)
# under /demo/, on every push to main.
#
# Also runs when a release is published, because the landing page names the
# current version and links straight at the installers for it. Those used to be
# typed by hand, which meant every release made the site quietly wrong until
# somebody noticed.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install
      - name: Build demo (VITE_DEMO=1, base /agentglass/demo/)
        run: cd web && bun run build:demo
      - name: Assemble site (landing at /, demo at /demo/)
        run: |
          mkdir -p site/demo
          cp -r landing/. site/
          cp -r web/dist/. site/demo/
          touch site/.nojekyll
      # The Flatpak channel. flatpak.yml accumulates an OSTree repo on the orphan
      # `flatpak-repo` branch and this is what serves it, because a repository
      # gets one Pages source and deploy-pages replaces the whole site each run —
      # so every deploy has to carry the repo or the remote 404s between releases.
      #
      # A no-op until the first tagged Flatpak build creates the branch, and
      # never fatal: the landing page is worth publishing even if the channel is
      # briefly unavailable. .nojekyll above is load-bearing here — an OSTree repo
      # has to be served byte-for-byte, and Jekyll skips files it thinks are
      # special.
      - name: Lay the Flatpak repo under /flatpak/, if there is one
        run: |
          if git clone --depth 1 --branch flatpak-repo \
              "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/flatpak-repo 2>/dev/null; then
            rm -rf /tmp/flatpak-repo/.git
            mkdir -p site/flatpak
            cp -r /tmp/flatpak-repo/. site/flatpak/
            du -sh site/flatpak | awk '{print "Flatpak channel: " $1}'
          else
            echo "No flatpak-repo branch yet — skipping the Flatpak channel."
          fi
      # Fills in the version and the per-OS download links. Never fatal: the
      # page ships with copy that is true without it, so a missing release or an
      # API hiccup costs precision, not correctness.
      - name: Stamp the current release into the landing page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/landing-release.mjs site/index.html
      # Counts visits to the page, and nothing else — the app never phones home.
      # No variable set means no counter ships, so a fork stays clean.
      - name: Stamp the page counter, if one is configured
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: bun scripts/landing-analytics.mjs site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
