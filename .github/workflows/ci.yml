name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      # The mark lives in seven places — a standalone SVG, the favicon, a React
      # component, the boot splash and three inlines in the landing page. They
      # drifted once and a fix shipped to six of them while the seventh kept
      # the bug, so they are generated now and this is what catches a hand-edit.
      - name: The mark is in sync
        run: bun scripts/logo.mjs --check
      # `bun run typecheck`, never `bunx tsc`. bunx runs a LOCAL binary if there
      # is one and silently downloads the newest published otherwise, and
      # `typescript` was declared in web/ and mobile/ but not server/ — so this
      # file was type-checking the same shared/types.ts with three different
      # compilers depending on the directory: measured on 2026-08-07, web got
      # 5.9.3 from node_modules and server got 7.0.2 off the registry. Nothing
      # in the repo asked for 7; a TS major landing on npm was enough to redden
      # a commit that changed nothing. Both are pinned to 5.9.3 in their
      # package.json now, and `bun run` fails loudly on a missing binary where
      # bunx would have gone and fetched one.
      # web's script checks tsconfig.json AND tsconfig.test.json — web/test/'s
      # 122 suites are run here by `bun test`, which strips types without
      # checking them, so until that second config existed nothing read them.
      - name: Typecheck web (app and tests)
        run: cd web && bun run typecheck
      - name: Typecheck server
        run: cd server && bun run typecheck
      - name: Tests (server)
        # Generous per-test timeout, not bun's 5s default: several server tests
        # do real git/spawn/settle work that finishes in ~seconds on a dev box
        # but brushes the 5s ceiling on the runner's constrained 2 cores, so one
        # would occasionally time out and redden main with no logic change behind
        # it. This only raises the ceiling — it can't hide a real regression,
        # which fails on its assertion, not the clock.
        run: cd server && bun test --timeout 20000
      # web/test/ was never run by CI, so the dashboard's own tests — diff
      # themes, the session-live rule, the file tree — could break on a PR and
      # nothing would say so.
      - name: Tests (web)
        run: cd web && bun test
      - name: Build web
        run: cd web && bunx vite build
      # Pinned rather than the runner's preinstalled Chrome: the ubuntu-latest
      # image has dropped and re-added browsers before, and this also keeps the
      # step working on container or self-hosted runners that ship none.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      # tsc, bun test and vite build all pass on a bundle that throws the
      # instant a browser evaluates it — a use-before-declaration inside a
      # component already shipped a black screen that way. This is the only
      # step that actually runs the thing.
      # On port 4000 because that is where the bundle looks. Without it the smoke
      # run has no repos, so it cannot open a chat, so the chat-persistence check
      # skips itself and the reload path goes uncovered.
      - name: Smoke (production bundle boots)
        run: |
          cd server
          AGENTGLASS_PORT=4000 AGENTGLASS_DB=/tmp/smoke.db AGENTGLASS_SCAN_DISABLED=1 bun run src/index.ts &
          SVPID=$!
          cd ..
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health >/dev/null && break; sleep 1; done
          bun scripts/smoke.ts
          STATUS=$?
          kill $SVPID || true
          exit $STATUS
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      # tsc, bun test and the smoke run all pass on a server that freezes for a
      # second at a time: the types are fine, the answers are correct, the bundle
      # boots. Only the clock disagrees, and the clock is what the user feels —
      # this process serves the terminal's PTY on the same thread as every git
      # call it makes. This is the only step that measures it.
      - name: Perf budget (the event loop stays answerable)
        run: bun scripts/perfbudget.ts
      - name: Server boots
        run: |
          cd server
          AGENTGLASS_PORT=4123 AGENTGLASS_DB=/tmp/ci.db AGENTGLASS_SCAN_DISABLED=1 bun run src/index.ts &
          SVPID=$!
          sleep 2
          curl -sf http://localhost:4123/health
          kill $SVPID

  # The phone had no CI at all: 29 suites and two tsconfigs that only ran when
  # somebody remembered, while mobile/README.md and mobile/.npmrc both described
  # a `npm ci` in CI that did not exist. A reader concluded the app was covered.
  #
  # Its own job rather than steps on `build`: mobile/ is not a bun workspace
  # member (the root package.json lists server, web, electron), it installs with
  # npm from its own package-lock.json, and nothing above depends on it — so a
  # red phone should not hide a green dashboard or wait behind vite.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No setup-node: `npm ci` IS Node, so every runner image carries one, and
      # the only floor this job has is `import.meta.dirname` in the two
      # generators below — Node 20.11, which every current image is long past.
      # An action tag guessed wrong fails the job before a single step runs,
      # which is a worse trade than trusting the image for a version floor
      # nothing here is near.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `npm ci` and not `npm install`: the lockfile is the point. Its
      # postinstall runs scripts/build-terminal-engine.mjs and
      # build-terminal-font.mjs, which write src/terminal/engine.generated.ts
      # and nerdfont.generated.ts — both gitignored, both imported by
      # terminal-html.ts. Skip this and the typecheck fails on a missing module
      # rather than on anything real.
      - name: Install (mobile)
        working-directory: mobile
        run: npm ci
      # The workspace install is not redundant, and not for the reason you would
      # guess. test/pairing-e2e.test.ts and test/fleet-shapes.test.ts spawn
      # `bun run src/index.ts` in ../server for real, and that imports
      # @anthropic-ai/sdk (server/src/walkthrough.ts). Drop this step and the
      # suites still pass — bun AUTO-INSTALLS a missing import at runtime — which
      # is worse than failing: measured on 2026-08-07, with no node_modules the
      # server resolved @anthropic-ai/sdk@0.115.0 while bun.lock pins 0.112.1.
      # That is the same disease as the `bunx tsc` this commit removed: a
      # dependency chosen by the registry rather than by the repo, silently, in
      # the only job that runs the server outside `build`.
      - name: Install (workspace — the server those two suites boot)
        run: bun install
      # Both configs: the app against React Native, the suites against
      # bun-types. `types` replaces rather than adds, so one file cannot hold
      # both — see mobile/tsconfig.test.json.
      - name: Typecheck mobile (app and tests)
        working-directory: mobile
        run: npm run typecheck
      # `npm test` is `bun test`; no --timeout here because the only suite that
      # needs more than bun's 5s default (test/pane-line.test.ts, a real Chrome
      # over CDP driving a real tmux) passes its own 30s per test rather than
      # depending on a flag somebody has to remember. That file self-skips
      # wherever /usr/bin/google-chrome, tmux or python3 is absent.
      - name: Tests (mobile)
        working-directory: mobile
        run: npm test
