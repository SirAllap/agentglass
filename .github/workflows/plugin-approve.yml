# The maintainer said yes: put the plugin in the catalogue.
#
# The submission check (plugin-submission.yml) says what a machine can tell.
# This is the other half: one label, applied by somebody with write access,
# turns a validated submission into an entry in `landing/plugins.json`.
#
# IT OPENS A PULL REQUEST RATHER THAN PUSHING. A bot that can write to `main`
# needs an apparatus around it — re-read the label event, re-check the actor,
# compare the body hash, recompute the diff and compare it byte for byte —
# and all of that exists to replace a person looking at a diff. At one
# maintainer and a handful of plugins, the person looking at the diff is
# cheaper, and it is the only reviewer this catalogue has.
#
# The guards that remain are the ones a pull request does not give you: the
# label has to be the event that started this run, the actor has to still
# have write access when the run reaches the API, and the issue has to still
# be open and still carry the submission label. A label applied and removed
# while the queue was busy must not list anything.
#
# WHAT IS APPROVED IS A COMMIT, NOT A REPOSITORY. An entry used to say
# `"ref": null`, and the app cloned the default branch at install: what the
# label approved was whatever the repository held that minute, and what a
# person installed a month later was whatever its author had pushed since.
# The entry now carries the commit this run cloned and the content hash of
# that tree, computed by the same walk the app does, and the app refuses an
# install that hashes to anything else. A new version is a new submission.
#
# And nothing here reports a check. The branch is pushed with a token that
# triggers CI, CI answers `build` and `catalogue` from the pull request's own
# content, and those are what auto-merge waits on — not a status this job
# could write about itself.
name: Plugin approval

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: plugin-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  list:
    if: github.event.label.name == 'approved for listing'
    runs-on: ubuntu-latest
    permissions:
      # Read, not write: the branch is pushed with the catalogue token below,
      # never with this job's, and a job that has just cloned a stranger's
      # repository holds as little as it can.
      contents: read
      # The fallback below comments on the issue when the pull request cannot
      # be opened, and without this it failed too — "Resource not accessible
      # by integration" — so a listing stopped at a branch nobody was told
      # about, on a run that went red having done its work correctly.
      issues: write
    steps:
      - name: Is the person who labelled it allowed to?
        env:
          ACTOR: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Live, not from the payload: permission is a thing that changes,
          # and the payload is a photograph of when the label was clicked.
          level=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null || echo none)
          case "$level" in
            admin|write|maintain) ;;
            *) echo "::error::$ACTOR has $level access; only write access lists a plugin"; exit 1 ;;
          esac
          state=$(gh api "repos/$REPO/issues/$ISSUE" --jq '.state')
          labels=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.labels[].name] | join(",")')
          [ "$state" = "open" ] || { echo "::error::issue is $state"; exit 1; }
          case ",$labels," in
            *,plugin-submission,*) ;;
            *) echo "::error::issue no longer carries the plugin-submission label"; exit 1 ;;
          esac
          case ",$labels," in
            *,"approved for listing",*) ;;
            *) echo "::error::the label was removed again before this run reached it"; exit 1 ;;
          esac

      # Without its credentials: nothing from the clone runs today, and a step
      # that one day does (an install, a linter) must find no token in
      # .git/config to take with it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # WHICH COMMIT. The one the submission check validated and reported on
      # — the report is what the maintainer read before labelling — and not
      # whatever the default branch holds now. This used to clone HEAD at
      # label time, so a push between the report and the label was listed
      # with nobody having seen it. The commit comes from the marker at the
      # end of the check's own comment, posted by this repository's workflow
      # token; a marker typed by anybody else is somebody else's comment.
      # And if the repository has moved on since, nothing is listed: the
      # submitter edits the issue, the check runs on the new commit, and a
      # maintainer labels what they read.
      - name: Which commit the check validated
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
          COMMENTS: /tmp/comments.jsonl
          EVENTS: /tmp/events.jsonl
          HEAD_FILE: /tmp/head
          REFUSED: /tmp/refused
        run: |
          set -euo pipefail
          repo=$(python3 -c 'import os,re;m=re.search(r"https://github\.com/([A-Za-z0-9._-]+)/([A-Za-z0-9._-]+)",os.environ.get("BODY",""));print(f"{m.group(1)}/{m.group(2).removesuffix(".git")}" if m else "")')
          [ -n "$repo" ] || { echo "::error::no repository URL in the issue"; exit 1; }
          gh api --paginate "repos/$REPO/issues/$ISSUE/comments" \
            --jq '.[] | {login: .user.login, type: .user.type, body, updated_at} | @json' > "$COMMENTS"
          gh api --paginate "repos/$REPO/issues/$ISSUE/events" \
            --jq '.[] | select(.event == "labeled") | {label: .label.name, created_at} | @json' > "$EVENTS"
          git ls-remote "https://github.com/$repo.git" HEAD | cut -f1 > "$HEAD_FILE"
          REPO_NAMED="$repo" python3 - <<'PY'
          import json, os, re, sys
          env = os.environ
          def refuse(why):
              open(env["REFUSED"], "w").write(why)
              print(f"::error::{why}")
              sys.exit(1)
          def rows(path):
              return [json.loads(l) for l in open(path) if l.strip()]
          MARK = re.compile(r"<!-- agentglass-plugin-submission-result (\{[^\n]*?\}) -->")
          reports = [c for c in rows(env["COMMENTS"])
                     if c.get("login") == "github-actions[bot]" and c.get("type") == "Bot"
                     and str(c.get("body", "")).startswith("<!-- agentglass-plugin-submission -->")]
          if not reports:
              refuse("there is no submission check report on this issue to list from")
          report = reports[-1]
          marks = MARK.findall(report["body"])
          if len(marks) != 1:
              refuse("the submission check report does not carry exactly one result")
          try:
              mark = json.loads(marks[0])
          except json.JSONDecodeError:
              refuse("the submission check result could not be read")
          commit = str(mark.get("commit", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              refuse("the submission check did not record a full commit; edit the issue to run it again")
          if not mark.get("manifest"):
              refuse("the submission check did not validate the manifest at that commit")
          # The latest report, and it passed: the commit listed is exactly the
          # one the latest green check validated. `ready` is the check's own
          # verdict, the one its labels are set from.
          if mark.get("ready") is not True:
              refuse("the latest submission check did not pass; edit the issue to run it again")
          if str(mark.get("repository", "")).casefold() != env["REPO_NAMED"].casefold():
              refuse("the submission check report is about a different repository than the issue names")
          # The report the label was given on: written after the label, it
          # is a report nobody had read when they clicked. Both times are in
          # whole seconds, so one written in the label's own second counts as
          # after it.
          labelled = [e["created_at"] for e in rows(env["EVENTS"]) if e.get("label") == "approved for listing"]
          if not labelled:
              refuse("no approved-for-listing label event on this issue")
          if report.get("updated_at", "") >= labelled[-1]:
              refuse("the submission check wrote its latest report after the label was applied, or in the same second; read it again and label again")
          head = open(env["HEAD_FILE"]).read().strip()
          if head != commit:
              refuse(f"the repository has moved since the check read it: the report is about {commit[:12]} "
                     f"and its default branch is now at {head[:12] or 'nothing'}. Edit the issue to check the new commit.")
          with open(env["GITHUB_OUTPUT"], "a") as f:
              f.write(f"sha={commit}\nrepo={env['REPO_NAMED']}\n")
          PY

      - name: Read the submission, and check it again from scratch
        id: entry
        env:
          REPO_NAME: ${{ steps.validated.outputs.repo }}
          VALIDATED: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          repo="$REPO_NAME"
          # Never the validation job's word for it: the check ran in another
          # job, on another machine. This fetches the very commit it named, by
          # id, and validates it again.
          git init -q /tmp/plugin
          git -C /tmp/plugin fetch -q --depth 1 "https://github.com/$REPO_NAME.git" "$VALIDATED"
          git -c core.autocrlf=false -c core.eol=lf -C /tmp/plugin checkout -q --detach FETCH_HEAD
          python3 bin/agentglass-plugin validate /tmp/plugin > /tmp/validate.json
          # The commit and the bytes this run looked at, which is what the
          # entry pins. The hash is the app's own walk (see `hash` in the
          # CLI), so the app can refuse an install that is anything else.
          sha=$(git -C /tmp/plugin rev-parse HEAD)
          [ "$sha" = "$VALIDATED" ] || { echo "::error::fetched $sha, not $VALIDATED"; exit 1; }
          python3 bin/agentglass-plugin hash /tmp/plugin > /tmp/hash.json
          # The scan the maintainer weighed ran on an earlier clone. This one
          # is what gets listed, so it is scanned again and the outcome goes
          # into the pull request next to the commit it describes.
          python3 scripts/plugin-baseline.py /tmp/plugin > /tmp/baseline.json || true
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$(python3 -c 'import json;print(json.load(open("/tmp/validate.json"))["name"])')" >> "$GITHUB_OUTPUT"

      - name: Write the entry
        id: write
        env:
          BODY: ${{ github.event.issue.body }}
          SOURCE: ${{ steps.entry.outputs.repo }}
          REPO_URL: https://github.com/${{ steps.entry.outputs.repo }}
          SHA: ${{ steps.entry.outputs.sha }}
          PLUGIN: /tmp/plugin
          VALIDATE: /tmp/validate.json
          HASH: /tmp/hash.json
          BASELINE: /tmp/baseline.json
          CATALOGUE: landing/plugins.json
          REFUSED: /tmp/refused
          PR_BODY: /tmp/pr-body.md
        run: |
          python3 - <<'PY'
          import json, os, re, sys, datetime, glob
          env = os.environ
          def refuse(why):
              # Said on the issue by the last step, and the run goes red: a
              # listing that was not written must not look like one that was.
              # A publisher is the submitter's text, on its way into a public
              # comment: defused the way the submission check defuses it.
              for a, b in (("`", "'"), ("<!--", "< !--"), ("-->", "-- >"), ("\r", " "), ("\n", " "), ("@", "@\u200b")):
                  why = why.replace(a, b)
              open(env["REFUSED"], "w").write(why)
              print(f"::error::{why}")
              sys.exit(1)
          sha = env.get("SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              refuse("the clone did not resolve to a commit")
          h = json.load(open(env["HASH"]))
          if not h.get("ok") or not re.fullmatch(r"[0-9a-f]{64}", h.get("sha256") or ""):
              refuse(f"the plugin folder could not be hashed: {h.get('error', 'no hash')}")
          shot = next((os.path.basename(f) for f in sorted(glob.glob(os.path.join(env["PLUGIN"], "preview.*")))
                       if f.rsplit(".", 1)[-1].lower() in ("png", "jpg", "jpeg", "webp")), None)
          body = env.get("BODY", "")
          v = json.load(open(env["VALIDATE"]))
          def field(label):
              m = re.search(rf"###\s+{label}\s*\n+(.+?)(?:\n###|\Z)", body, re.S)
              return (m.group(1).strip() if m else "")
          # The manifest's key names, in the words the catalogue and the site
          # use. Without this an entry says "prActions" on a card whose
          # legend only knows "a button in pull requests".
          WORD = {"panels": "panel", "settings": "settings", "prNotes": "pr-notes", "prActions": "pr-button"}
          cat = json.load(open(env["CATALOGUE"]))
          source_owner = env["SOURCE"].split("/")[0]
          # A publisher is any 200 characters the manifest likes, and the card
          # prints it as the byline. The project's own name, and its owner's,
          # belong to repositories under that owner — spaces, case and
          # punctuation do not make "Agent Glass" somebody else.
          said = re.sub(r"[^a-z0-9]", "", v["publisher"].casefold())
          reserved = ("agentglass", re.sub(r"[^a-z0-9]", "", cat["owner"].casefold()))
          if any(r and r in said for r in reserved) and source_owner.casefold() != cat["owner"].casefold():
              refuse(f"publisher {v['publisher'][:80]!r} is a name this catalogue reserves for {cat['owner']}'s own repositories")
          # An id is a handle the app installs by, and the folder it installs
          # into. A submission that names one already listed from somewhere
          # else would swap that entry's source for its own — a hijack in the
          # shape of an update. The same repository may list a new version.
          listed = next((p for p in cat["plugins"] if p["id"] == v["name"]), None)
          if listed and listed["source"]["url"].rstrip("/").removesuffix(".git").casefold() != env["REPO_URL"].casefold():
              refuse(f"{v['name']!r} is already listed from {listed['source']['url']}; a different repository cannot take its place")
          entry = {
              "id": v["name"],
              "title": v["name"].replace("-", " ").title(),
              "publisher": v["publisher"],
              "verified": False,
              "scope": v["scope"],
              "draws": [WORD.get(d, d) for d in (v.get("draws") or [])],
              "source": {"kind": "git", "url": env["REPO_URL"], "ref": sha},
              "sha256": h["sha256"],
              "description": (field("What it does, in two or three sentences") or "")[:500],
              "categories": list(dict.fromkeys(
                  [c for c in [field("Category").lower()] if c and c != "_no response_"]
                  + [t.strip().lower() for t in field("Tags").split(",") if t.strip() and t.strip() != "_no response_"][:5])),
              "added": datetime.date.today().isoformat(),
              **({"minApp": v["minApp"]} if v.get("minApp") else {}),
              # A picture if the repository ships one at its root, the way
              # a README's own screenshot is found — at the listed commit, so
              # the card cannot change picture after the label either.
              **({"preview": f"https://raw.githubusercontent.com/{env['SOURCE']}/{sha}/{shot}"} if shot else {}),
          }
          # `verified` is the catalogue's own word for "this project wrote it",
          # never something a submission can ask for.
          others = [p for p in cat["plugins"] if p["id"] != entry["id"]]
          cat["plugins"] = sorted(others + [entry], key=lambda p: p["id"])
          # `ensure_ascii=False`: the file is read by people in a diff, and an
          # em dash written as \u2014 is a description nobody can review.
          with open(env["CATALOGUE"], "w") as f:
              json.dump(cat, f, indent=2, ensure_ascii=False)
              f.write("\n")
          # What the pull request says: the commit, the hash, and what the
          # scan found at THAT commit. Finding ids are this repository's own
          # words; nothing of the submission's text is quoted here.
          try:
              b = json.load(open(env["BASELINE"]))
          except (OSError, json.JSONDecodeError):
              b = {"outcome": "unreadable", "findings": []}
          kinds = sorted({f["id"] for f in b.get("findings") or [] if re.fullmatch(r"[a-z-]{1,60}", str(f.get("id", "")))})
          scan = {"passed": "the scan found none of the patterns it knows",
                  "findings": f"the scan found {len(b.get('findings') or [])} line(s) worth an eye: {', '.join(kinds)}"
                  }.get(b.get("outcome"), "the scan did not complete, so nothing is known about the source at this commit")
          open(env["PR_BODY"], "w").write(
              f"Pinned to `{sha}`, content hash `{h['sha256']}` over {h['files']} file(s).\n\n"
              f"At that commit {scan}. The app installs this commit and refuses any tree that hashes to "
              "something else, so what is merged here is what installs.\n")
          PY
          python3 -c "import json;json.load(open('landing/plugins.json'))"

      # The identity that pushes the branch and opens the pull request: a
      # GitHub App installed on this repository alone, with contents and pull
      # requests and nothing else, minted here for this run and gone within
      # the hour. It replaced a personal token of a repository admin, whom
      # the ruleset lets bypass it always — a leak of that one secret was a
      # push to main and a release tag. The App is not an admin, has no
      # bypass, and its pushes still trigger CI, which is what the required
      # checks and auto-merge wait on.
      - name: A token for this one pull request
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CATALOGUE_APP_ID }}
          private-key: ${{ secrets.CATALOGUE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a pull request with it
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NAME: ${{ steps.entry.outputs.name }}
          SOURCE: ${{ steps.entry.outputs.repo }}
          SHA: ${{ steps.entry.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="list-$NAME-$ISSUE"
          git checkout -b "$branch"
          git add landing/plugins.json
          git commit -m "catalogue: list $NAME

          From #$ISSUE. The manifest was validated again here from a fresh
          clone, and the entry pins $SOURCE at $SHA with the content hash of
          that tree: the app installs that commit and nothing else.

          Listing is not auditing: this says the repository is public, the
          manifest is one the app accepts, and somebody with write access said
          yes. It says nothing about what the plugin does."
          # Pushed with the App's token, not this job's. A ref pushed by
          # GITHUB_TOKEN does not trigger a workflow run — GitHub's guard
          # against a workflow feeding itself — so `build` never reported on
          # the pull request and the required check sat "Expected" for ever.
          # Pushing as another identity is what makes CI run.
          git push "https://x-access-token:${CATALOGUE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          # No status is written here. This job used to post `build=success`
          # on its own commit, with `statuses: write`, and that one grant let
          # the only guard on main be satisfied by the workflow it guards.
          # The push above triggers CI, and CI's `build` and `catalogue` jobs
          # judge the pull request from its own content.
          # A repository can forbid Actions from opening pull requests, and
          # this one does: the switch that would allow it is the same one that
          # lets a bot approve reviews, and a catalogue whose only reviewer is
          # a person does not hand that away to save a click. So the branch is
          # pushed either way and the link is handed to the maintainer.
          body="Closes #$ISSUE

          Adds \`$NAME\` to \`landing/plugins.json\` from https://github.com/$SOURCE.

          $(cat /tmp/pr-body.md)

          Read the submission check on the issue before merging — it says what installing this costs and which lines are worth an eye."
          # Opened with the App's token, not this job's. GitHub forbids
          # Actions from opening pull requests here, and the switch that would
          # allow it is the same one that lets a bot approve reviews — a
          # catalogue whose only reviewer is a person does not hand that away.
          # The App buys the one capability without the other.
          # Merged by the checks, not by anybody's approval, and never by the
          # App: it opens the pull request and arms auto-merge, and GitHub
          # merges once the checks main requires are green. Only when main's
          # rules make `catalogue` one of them — auto-merge waits on whatever
          # main requires, and a main that required nothing would merge the
          # listing on nothing. So the rules are read first, with this job's
          # own token, which can read them and write nothing.
          gh api --paginate "repos/$GITHUB_REPOSITORY/rules/branches/main" --jq '.[] | @json' > /tmp/rules.jsonl 2>/dev/null || : > /tmp/rules.jsonl
          gate=$(RULES=/tmp/rules.jsonl python3 - <<'PY'
          import json, os
          required = set()
          try:
              for line in open(os.environ["RULES"]):
                  if not line.strip():
                      continue
                  rule = json.loads(line)
                  if isinstance(rule, dict) and rule.get("type") == "required_status_checks":
                      checks = (rule.get("parameters") or {}).get("required_status_checks")
                      if isinstance(checks, list):
                          required |= {c.get("context") for c in checks if isinstance(c, dict)}
          except (OSError, ValueError):
              required = set()
          print("armed" if "catalogue" in required else "waits")
          PY
          )
          if GH_TOKEN="$CATALOGUE_TOKEN" gh pr create --title "catalogue: list $NAME" --body "$body" --base main --head "$branch" 2>/tmp/pr.err; then
            # The mutation that only arms auto-merge, not `gh pr merge --auto`,
            # which merges at once when nothing is pending on the pull request.
            if [ "$gate" = armed ] \
              && pr=$(GH_TOKEN="$CATALOGUE_TOKEN" gh pr view "$branch" --json id --jq .id) \
              && GH_TOKEN="$CATALOGUE_TOKEN" gh api graphql \
                -f query='mutation($pr: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $pr, mergeMethod: SQUASH}) { clientMutationId } }' \
                -f pr="$pr" >/dev/null; then
              exit 0
            fi
            if [ "$gate" = armed ]; then
              why="auto-merge could not be armed on it"
            else
              why="\`main\` does not require the \`catalogue\` check, and a listing merges by itself only behind that check"
            fi
            echo "::warning::the pull request waits for a maintainer: $why"
            gh issue comment "$ISSUE" --body "The pull request is open and waits for a maintainer to merge it: $why."
            exit 0
          fi
          echo "::warning::could not open the pull request: $(tail -1 /tmp/pr.err)"
          gh issue comment "$ISSUE" --body "The entry is written and pushed to \`$branch\`, and this run could not open the pull request itself: $(tail -1 /tmp/pr.err)

          Open it here: https://github.com/${GITHUB_REPOSITORY}/compare/main...$branch?expand=1"

      - name: Say why nothing was listed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Only a refusal this run wrote itself, in its own words. Anything
          # else that failed is in the run's log, and the issue is not told a
          # guess about it.
          [ -s /tmp/refused ] || exit 0
          gh issue comment "$ISSUE" --body "Not listed: $(head -c 400 /tmp/refused)"
