name: Desktop binaries

# Builds the Electron desktop app for every platform and attaches the installers
# to the GitHub Release for the tag. It deliberately only ever *uploads assets* —
# the release itself and its hand-written notes belong to release.yml, which is
# careful never to overwrite them. Nothing here touches the release body.
#
# Run it by hand (workflow_dispatch) to check the build still works without
# cutting a tag; that path builds everything and uploads nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # one platform failing shouldn't strand the others
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc — newer runners break older distros
            bunTarget: bun-linux-x64
            builder: --linux AppImage deb
          - os: macos-14
            bunTarget: bun-darwin-arm64
            builder: --mac dmg --arm64
          - os: macos-14 # Intel mac cross-built from the arm64 runner
            bunTarget: bun-darwin-x64
            builder: --mac dmg --x64
          - os: windows-latest
            bunTarget: bun-windows-x64
            builder: --win nsis

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags, so `git describe --tags` in build.mjs can name
          # the release this build descends from. A shallow checkout has no tag
          # object, which would stamp the installer with an empty baseTag and
          # leave the About pane unable to say which release it is.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile, unlike the other workflows: a release binary has to be
      # the committed lockfile's build, and `bun install` rewriting bun.lock
      # would make the tree dirty — which now shows up in the stamp on every
      # installer anyone downloads. A stale lockfile failing here, loudly, is
      # the better end of that trade.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Build web
        run: cd web && bun run build

      # The server ships as a compiled sidecar, cross-built for the target. On
      # Windows it needs the .exe extension so the app can spawn it.
      - name: Compile server sidecar
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          mkdir -p electron/staging
          bun build --compile --target=${{ matrix.bunTarget }} server/src/index.ts \
            --outfile "electron/staging/agentglass-server${ext}"
          # The Claude model catalogue is read from disk at runtime, not
          # imported, so --compile does not carry it. It goes beside the sidecar
          # because that is where claudemodels.ts looks in a packaged app
          # (dirname(process.execPath)). Without this the desktop build falls
          # back to a single model id and the dropdown looks broken.
          cp shared/claude-models.json electron/staging/claude-models.json

      # A static tmux rides along for the pane engine (scripts/build-tmux-static.sh),
      # so a machine without tmux still gets tabs, splits and persistence — the
      # engine runs its own tmux; the user's is never involved. Windows skips:
      # the pane engine is POSIX-only and stays an honest "off" there.
      # zig is the C compiler the Linux target builds against — musl static,
      # cross-compiled from the same script a developer runs. Without it
      # `configure` gets no compiler and answers "C compiler cannot create
      # executables", which is what the first tag cut after the vendored
      # binaries landed died on.
      - name: zig, for the musl target
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          # The version this repository's own builds are made with.
          version: 0.16.0

      - name: Build bundled tmux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # First run on a fresh checkout pins the tarball checksums from the
          # downloads; every later build verifies against the pins.
          if grep -q placeholder scripts/tmux-build-checksums.txt; then
            ./scripts/tmux-fill-checksums.sh
          fi
          mkdir -p electron/staging
          TARGET=${{ matrix.bunTarget }} ./scripts/build-tmux-static.sh
          cp out/tmux-${{ matrix.bunTarget }} electron/staging/tmux
          ./out/tmux-${{ matrix.bunTarget }} -V
          # A smoke test with the exact flags the engine uses: own socket, own
          # config, scratch TMUX_TMPDIR, then gone.
          tmpdir="$(mktemp -d /tmp/tmux-smoke.XXXXXX)"
          TMUX_TMPDIR="$tmpdir" electron/staging/tmux -L smoke -f /dev/null new-session -d
          TMUX_TMPDIR="$tmpdir" electron/staging/tmux -L smoke kill-server
          rm -rf "$tmpdir"

      # The version the artefacts carry, from the tag. It used to be written
      # INTO electron/package.json by a step here, and that quietly cost the
      # build stamp its meaning: every input to the package is copied off disk,
      # so a CI run that edits a tracked file is a build of a tree that is not
      # the tag. With the stamp now hashing that tree, the edit would have put
      # `+dirty` on every release binary — a warning that fires on every build
      # is a warning nobody reads.
      #
      # `-c.extraMetadata.version` does the same job without touching the
      # checkout. Measured on electron-builder 26.15 rather than assumed, since
      # the fear was that only the in-asar manifest would pick it up: with
      # `-c.extraMetadata.version=9.9.9` the artefact is agentglass_9.9.9_amd64.deb,
      # latest-linux.yml says `version: 9.9.9`, the deb's control Version is
      # 9.9.9, and `git status electron/package.json` is empty afterwards.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Stamp provenance INTO staging, next to the sidecar CI just compiled, so
      # the installer carries build-info.json (version/commit/origin/baseTag)
      # and self-update.sh. Without this the packaged app records no origin, and
      # updateStatus() blocks with "reinstall from source" — no update badge,
      # no notification, no way to install a new release. --provenance-only is
      # deliberate: it must not rebuild the web UI or recompile the sidecar,
      # which is cross-built for this matrix target and cannot be reproduced on
      # the runner's own arch. Runs after the version sync so build-info carries
      # the tag's version, and before packaging so extraResources picks it up.
      - name: Stamp provenance (build-info.json + self-update.sh)
        shell: bash
        run: node electron/build.mjs --provenance-only

      # electron-builder packages the app; the web build and staged sidecar come
      # in via extraResources (see electron/package.json "build").
      - name: Package
        shell: bash
        working-directory: electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An `if`, not `[ -n … ] && ver=(…)`: GitHub runs `run:` under `-e`, so
          # the && form exits the step with 1 on every non-tag build — the test
          # failing IS the last command.
          ver=()
          if [ -n "${PKG_VERSION:-}" ]; then ver=(-c.extraMetadata.version="$PKG_VERSION"); fi
          bunx electron-builder ${{ matrix.builder }} "${ver[@]}" --publish never

      # The stamp has to describe what was packaged, and build.mjs necessarily
      # runs before electron-builder copies the files. Re-hashing the tree here
      # closes that window — and on a runner it also catches the other way this
      # can go wrong: a step that edits the checkout between the two. That is
      # exactly what the version sync used to do.
      - name: Check the stamp still describes the tree
        shell: bash
        run: node electron/build.mjs --check-stamp electron/staging/build-info.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find electron/dist-app -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.exe' \) \
            -print0 | while IFS= read -r -d '' path; do
              echo "uploading $path"
              gh release upload "$GITHUB_REF_NAME" "$path" --clobber --repo "$GITHUB_REPOSITORY"
            done

      - name: Keep the build even when there is no tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: agentglass-${{ matrix.bunTarget }}
          path: |
            electron/dist-app/*.AppImage
            electron/dist-app/*.deb
            electron/dist-app/*.dmg
            electron/dist-app/*.exe
          if-no-files-found: warn
