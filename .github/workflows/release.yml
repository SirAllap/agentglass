name: Release

# A pushed v* tag gets a GitHub Release created from its annotation — but a
# release that already exists (e.g. published from the UI, which is also what
# creates the tag) is left strictly alone. Overwriting almost erased the
# hand-written v0.1.0 notes once; never again.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # need the real tag object, not a shallow peel
      - name: Create release only if the tag has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists — leaving it untouched"
            exit 0
          fi
          # checkout leaves the tag as a lightweight ref pointing at the commit,
          # so %(contents) yields the commit message and the annotation — the
          # actual release notes — is lost. Re-fetch to get the tag object.
          git fetch --force --tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

          # And refuse if it is lightweight for real, rather than publishing a
          # commit message as the release notes. %(contents) never fails and
          # never comes back empty on such a tag — it just answers with the
          # wrong thing, which is how a merge subject becomes a release body.
          kind="$(git for-each-ref --format='%(objecttype)' "refs/tags/$GITHUB_REF_NAME")"
          if [ "$kind" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag ($kind) — it carries no annotation to publish." >&2
            echo "Cut it with: git -c gpg.format=ssh -c user.signingkey=<release key> tag -s --cleanup=verbatim $GITHUB_REF_NAME -F notes.md" >&2
            exit 1
          fi

          # The updater refuses a tag that is not signed by the pinned release key
          # (electron/release-allowed-signers), so a release cut from an unsigned
          # tag is one nobody can install in-app. v0.20 to v0.23.1 went out that
          # way. Fail here, before a public release exists, not on an installed app.
          if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$PWD/electron/release-allowed-signers" \
                 -c gpg.program=false -c gpg.openpgp.program=false -c gpg.x509.program=false \
                 verify-tag "refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME is not signed by the pinned release key (electron/release-allowed-signers): the in-app update would refuse it." >&2
            echo "Re-cut it with the release key: git -c gpg.format=ssh -c user.signingkey=<release key> tag -s --cleanup=verbatim $GITHUB_REF_NAME -F <notes>" >&2
            exit 1
          fi

          # Every tag is signed now (the updater refuses an unsigned one), and
          # %(contents) includes the trailing signature armor along with the
          # message — dropped here so a release's public notes are the
          # message a person wrote, not that plus a block of base64.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" \
            | sed '/^-----BEGIN \(PGP\|SSH\) SIGNATURE-----$/,$d' > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
