name: Android APK

# Builds the phone companion and attaches the APK to the GitHub Release for the
# tag. Like desktop-binaries.yml it only ever *uploads assets*: the release and
# its hand-written notes belong to release.yml, and nothing here touches the
# body.
#
# Run it by hand (workflow_dispatch) to check the build still works without
# cutting a tag; that path builds and uploads nothing to a release.
#
# ── why this job runs `expo prebuild` ─────────────────────────────────────
# `mobile/android/` is generated and gitignored (mobile/.gitignore says why).
# The cost of that choice is paid right here, and it was measured rather than
# assumed: on 2026-08-08, from an empty mobile/android/, prebuild took **2
# seconds** and produced 552 KB — against 5m18s for the Gradle build it feeds.
# Committing the tree would save those two seconds and buy a second source of
# truth that silently outranks app.json, including the signing plugin below,
# which exists only inside prebuild's output.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run has anything to build.
  #
  # A tag that changes nothing the phone is made of would otherwise spend the
  # 5m18s of Gradle described above reproducing the APK the previous tag already
  # published — and attach it to a release as if the phone had been rebuilt and
  # checked at that tag, which it had not. An artefact that does not exist
  # misleads nobody; one carrying the wrong version does.
  #
  # `shared/` counts as the phone: it imports palettes, project, providers,
  # session, term and types from there, so a change to the wire is a change to
  # the app even with mobile/ untouched. So does this workflow, because a build
  # whose recipe changed has not been proven by the last one that ran.
  #
  # workflow_dispatch always builds. Running it by hand is asking whether the
  # build still works, and "nothing changed" is not an answer to that question.
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.q.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag is history, not the checkout
      - id: q
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "asked by hand — building"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The tag before this one, ignoring this one. Missing on the very first
          # tag, and then there is no "since" to compare against.
          prev="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "no earlier tag — building"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$prev" "$GITHUB_REF_NAME" -- mobile/ shared/ .github/workflows/android-apk.yml)"
          if [ -n "$changed" ]; then
            echo "changed since $prev:"; echo "$changed"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            # Said out loud rather than silently skipped: a job that vanishes
            # from a release run reads as a job that broke.
            echo "nothing under mobile/ or shared/ changed since $prev — the phone"
            echo "of $prev is still the current build, and its APK is on that release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      # Whether this run can sign for real, decided once. A step's `if:` cannot
      # read `secrets` and cannot read its own `env:` block, so the question has
      # to be answered here, where the secrets context is in scope.
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7

      # The runner ships several JDKs and the Android toolchain is not free to
      # pick: React Native 0.86's Gradle plugins request a Java 17 toolchain,
      # and a build run on the wrong one dies with "does not provide the
      # required capabilities: [JAVA_COMPILER]" — measured on this laptop,
      # where the default `java` was a JRE.
      #
      # Read in a shell step and not as `${{ env.JAVA_HOME_17_X64 }}`: that
      # expression looks right and expands to nothing, because the `env` context
      # holds what the workflow declared, not what the image exported. Chosen
      # over an action for the reason ci.yml's mobile job gives — an action tag
      # guessed wrong fails the job before a single step runs.
      - name: Point Gradle at the JDK it asks for
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/javac" -version

      # `npm ci` and not `npm install`: same reasoning as ci.yml's mobile job —
      # the lockfile is the point, and its postinstall writes the two generated
      # sources (terminal engine, icon font) that the app imports.
      - name: Install (mobile)
        working-directory: mobile
        run: npm ci

      # The version the APK carries, from the tag.
      #
      # Editing a tracked file in CI is exactly what desktop-binaries.yml
      # refuses to do — but its reason is a build stamp that hashes the tree,
      # and no such stamp exists here. What does exist is the failure this
      # avoids: app.json pins versionCode 1, so without this step every release
      # ever published would be versionCode 1, and a phone would have no way to
      # tell last month's download from this one. Android orders builds by that
      # integer and by nothing else.
      #
      # v0.8.1 → 801. Monotonic while minor and patch stay under 100, which is
      # the same assumption the tag scheme already makes.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const [maj, min, pat] = v.split(".").map((n) => parseInt(n, 10) || 0);
            const app = JSON.parse(fs.readFileSync("mobile/app.json", "utf8"));
            app.expo.version = v;
            app.expo.android.versionCode = maj * 10000 + min * 100 + pat;
            fs.writeFileSync("mobile/app.json", JSON.stringify(app, null, 2) + "\n");
            console.log(`version ${v}, versionCode ${app.expo.android.versionCode}`);
          '

      # Regenerates mobile/android/ from app.json — including the release
      # signingConfig, which mobile/plugins/with-release-signing.js adds from
      # inside this command and nowhere else. --no-install because npm ci above
      # already did it, and letting prebuild run its own install would drop the
      # lockfile's resolution on the floor.
      - name: Prebuild the native project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # Written outside the checkout on purpose: a keystore under mobile/ would
      # be visible to prebuild, to Gradle's packaging globs and to any step that
      # uploads a directory. RUNNER_TEMP is wiped with the runner.
      #
      # The owner's keystore uses one password for the store and for the key,
      # which is why one secret feeds both variables. base64 -d reads the secret
      # from the environment rather than from a command line, so it never
      # reaches the process list or the log.
      - name: Unpack the signing key
        if: env.HAVE_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printenv KEYSTORE_B64 | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "AGENTGLASS_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # A tag that cannot be signed must not produce a file anybody installs.
      # The plugin's fallback — sign the release with the shared debug key — is
      # right for a laptop and wrong for a published asset: it installs, it
      # runs, and the only symptom is that the next release cannot replace it,
      # because Android refuses an update signed by a different key. Loud here
      # beats discovering it on somebody's phone.
      - name: A tagged build has to be really signed
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish a debug-signed release APK." >&2
          exit 1

      - name: Build the APK
        working-directory: mobile/android
        env:
          AGENTGLASS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AGENTGLASS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AGENTGLASS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # Named for the release it belongs to, because `app-release.apk` in a
      # downloads folder next to three other downloads says nothing.
      - name: Name it after the tag
        run: |
          name="agentglass-${GITHUB_REF_NAME:-dev}.apk"
          mv mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"
          ls -l "$name"

      # Proof that the signature is the release one and not the debug key, from
      # the APK itself rather than from the Gradle log — the log says what the
      # build intended, apksigner says what the file carries. The certificate's
      # subject is printed; nothing here prints the key or the password.
      - name: Say which key signed it
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Buscado en tres sitios y no en uno. La primera versión hacía
          # `ls -d "$ANDROID_HOME"/build-tools/*` a secas: si esa variable no llega
          # al paso, el glob revienta, `bash -e` mata el paso y —por ir todo en una
          # tubería— no se imprime el motivo. Bloqueó la subida de un APK que estaba
          # correctamente firmado, y el log solo decía "exit code 1".
          root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          signer="$(command -v apksigner || true)"
          if [ -z "$signer" ] && [ -d "$root/build-tools" ]; then
            signer="$(ls -d "$root"/build-tools/* 2>/dev/null | sort -V | tail -1)/apksigner"
          fi
          if [ ! -x "$signer" ]; then
            echo "::error::apksigner no encontrado (ANDROID_HOME=${ANDROID_HOME:-vacio} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-vacio})"
            ls -d "$root"/build-tools/* 2>&1 || true
            exit 1
          fi
          # Sin tubería: la salida entera al log y el grep decide después, para que
          # un fallo se pueda leer en vez de dejar un exit 1 desnudo.
          out="$("$signer" verify --print-certs "$APK" 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          # Dos formatos, y esto ya costó dos intentos: build-tools 36 imprime
            # `Signer #1 certificate DN:` y el apksigner del runner imprime
            # `V2 Signer: certificate DN:`. Comprobé el patrón contra el apksigner
            # de MI máquina, vi que casaba, y descarté la hipótesis buena — la
            # verifiqué en la máquina equivocada. Se ancla en lo que comparten.
            echo "$out" | grep -qE "certificate DN:" || { echo "::error::apksigner no informó de ningún firmante"; exit 1; }
            echo "$out" | grep -q "CN=Android Debug" && { echo "::error::firmado con la clave de depuración"; exit 1; }
            echo "Firmado, y no con la clave de depuración."

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$APK" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the build even when there is no tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: agentglass-android
          path: ${{ env.APK }}
          if-no-files-found: error
