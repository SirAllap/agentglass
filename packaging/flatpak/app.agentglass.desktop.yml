# Flatpak manifest for the desktop app.
#
# This packages an ALREADY BUILT tree: `electron-builder --linux dir` produces
# electron/dist-app/linux-unpacked on the way to the AppImage, and this copies
# that in. Nothing is compiled here, so the Flatpak and the AppImage are the
# same build of the same app.
#
# electron-builder has a flatpak target of its own and it is deliberately not
# used: it defaults to runtime 20.08, which is long EOL and no longer on
# Flathub, and it is built on @malept/flatpak-bundler, archived upstream since
# 2022.
#
# --- Read this before changing finish-args ---
#
# This Flatpak is NOT a security boundary, and is not trying to be one.
#
# agentglass supervises the agent CLIs on your machine. It runs `claude`, reads
# your repositories with `git`, drives `docker` and `gh`, and opens your login
# shell. Every one of those lives on the host. `--talk-name=org.freedesktop.Flatpak`
# is what lets it reach them, and it is a full sandbox escape: anything that can
# ask that portal to run a host process can run any host process. Combined with
# `--filesystem=host` the confinement here is, honestly, packaging and nothing
# more.
#
# It is the same hole VS Code's Flatpak carries, for the same reason. Without it
# the app starts and reports every single dependency missing, which is not a
# safer product, only a broken one.
#
# It is written down here, in the README, and on the install page instead of
# being left for someone to work out from a permission list, because a user
# installing a Flatpak has every reason to expect confinement and this one does
# not provide it. `flatpak override` narrows it afterwards, and the app degrades
# honestly when narrowed -- the deps panel names what it can no longer reach.
app-id: app.agentglass.desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: agentglass
separate-locales: false

# Do not strip, and do not split debuginfo out.
#
# This is not a preference, it is a correctness requirement, and it cost a
# broken build to find. flatpak-builder strips every ELF it exports. The server
# sidecar is a `bun build --compile` binary, which is an ELF with the
# application appended AFTER it -- and stripping rewrites the ELF and throws the
# appended payload away. The result still runs, which is what makes it nasty:
# it silently reverts to being the plain `bun` CLI and prints bun's help text
# instead of starting the server. The app window opens onto a backend that never
# comes up.
#
# Measured before choosing: stripping this tree reclaims about 49 KB in total,
# because Electron's binaries ship stripped from upstream already and the tmux
# build is static and small. So the entire cost of keeping symbols here is
# negligible, and it buys back a sidecar that works.
build-options:
  strip: false
  no-debuginfo: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  # The escape. See the note at the top of this file before touching either.
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak
  # Raising an alert when an agent needs you and no window is open to say so.
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: agentglass
    buildsystem: simple
    build-commands:
      # The packaged app, verbatim from electron-builder.
      - mkdir -p /app/agentglass
      - cp -a linux-unpacked/. /app/agentglass/

      # The launcher, and the host shims it puts on PATH.
      - install -Dm755 packaging/agentglass-wrapper.sh /app/bin/agentglass
      - mkdir -p /app/hostbin
      - cp -a packaging/hostbin/. /app/hostbin/

      - install -Dm644 packaging/app.agentglass.desktop.desktop
        /app/share/applications/app.agentglass.desktop.desktop
      - install -Dm644 packaging/app.agentglass.desktop.metainfo.xml
        /app/share/metainfo/app.agentglass.desktop.metainfo.xml
      - install -Dm644 icon-512.png
        /app/share/icons/hicolor/512x512/apps/app.agentglass.desktop.png
    sources:
      - type: dir
        path: ../../electron/dist-app/linux-unpacked
        dest: linux-unpacked
      # hostbin/ is generated by hostbin.ts before this runs; it is not in git.
      - type: dir
        path: .
        dest: packaging
      - type: file
        path: ../../electron/icons/icon-512.png
