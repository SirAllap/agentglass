<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentglass</title>
    <meta name="description" content="Every AI coding agent on your machine, on one screen — live cost, tokens and tool calls across every provider, and a hold on anything dangerous until you say go. From your desk or your phone." />
    <!--
      Relative, not absolute. The demo build is served from
      /agentglass/demo/, and `/favicon.svg` there resolves to the host root
      and 404s — the manifest link two lines down already got this right.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      Installable on a phone.

      The remote-access flow ends with someone scanning a QR code, and a link
      opened from a camera lands in a browser tab that they will lose. With a
      manifest the same page can be added to the home screen and opens
      standalone, which is what makes it something you go back to rather than a
      bookmark — and `theme_color` is what stops iOS drawing a white status bar
      over a dark UI. `start_url` is relative on purpose: the token is stripped
      from the URL on first load and kept in storage, so the installed copy must
      resolve against whatever host it was installed from, not a baked-in one.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#17181b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agentglass" />
    <!--
      A PNG, because iOS does not support SVG here at all. It ignored the tag,
      fell back to a screenshot of the page, and the home-screen icon was a
      shrunken dashboard.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!--
      What fills the window until the app is ready: the launch cover.

      The bundle is ~1.8 MB of JS and CSS that has to arrive, parse and execute
      before a single pixel is drawn, and `<div id="root"></div>` paints as
      nothing — so the app opened onto a black rectangle and looked like it had
      failed to start. This is markup, not an app: no imports, no framework and
      no request of its own, so it is on screen in the first frame.

      It stays up past React's mount, on purpose. A cold start used to show the
      app assembling itself in pieces — an empty terminal, a tab strip that
      changed shape, a git pane saying it was reading — for a second or more
      after the first paint. The app now mounts and loads UNDER the cover, and
      lib/cover.ts takes it down when the panels on screen say they have drawn
      their first real data: the mark flies to its place in the title bar and
      the app is simply there. It never waits for anything else, it has a cap,
      and a load that fails says so here instead of spinning.

      It also tells the truth rather than spinning decoratively. The sidecar is
      started in parallel with the window (see electron/main.js), so at this
      point it may not be answering yet — the script below asks /health and says
      which of the two things is actually pending. No progress bar: nothing here
      can measure progress honestly, and a bar that stalls at 90% is worse than
      no bar at all.

      Every motion on it is a CSS animation of transform or opacity, which the
      compositor runs without the main thread — the thread that is busy the
      whole time the cover is up. That is also why the orbit is not SMIL: see
      scripts/logo.mjs, which generates the mark and its sheet below.
    -->
    <style>

      #ag-cover {
        position: fixed; inset: 0; z-index: 2147483000; display: none; overflow: hidden;
        --agc-m: clamp(150px, 30vmin, 270px);
        color: var(--primary, #58a6ff);
        font: 11px/1.45 "SF Mono", SFMono-Regular, ui-monospace, "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
        -webkit-user-select: none; user-select: none;
      }
      html.ag-covering #ag-cover { display: block; }
      /* Handing over: nothing on the cover takes a click from the app below,
         and the drag strip stops shadowing the title bar's own controls. */
      #ag-cover.agc-leaving { pointer-events: none; }
      #ag-cover.agc-leaving .agc-drag { display: none; }
      /* The ground is its own layer so it can fade without taking the mark with it. */
      .agc-bg { position: absolute; inset: 0; background: var(--bg, #0d1117); }
      /* The window is frameless and its title bar is under the cover, so this
         strip is the only thing that can still move it during a slow start. */
      .agc-drag { position: absolute; left: 0; right: 0; top: 0; height: 30px; -webkit-app-region: drag; }
      .agc-col {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: calc(var(--agc-m) * .34);
        padding: 16px 16px calc(16px + 6vh);
      }
      .agc-stage { position: relative; flex: none; width: var(--agc-m); height: var(--agc-m); }
      .agc-stage > *, .agc-fx > *, .agc-fy > *, .agc-fs > * { position: absolute; inset: 0; }
      /* Around the mark, a sky: a breathing glow, stars in three twinkling
         layers, and a far, shallow orbit with a satellite of its own. The mark
         is the one bold thing; all of this stays behind it. The big mark's
         orbit runs every frame here (the sheet above steps it for the title
         bar, where it is small): at this size a stepped contact would stutter. */
      #ag-cover :is(.ag-lm-arm, .ag-lm-dot) { animation-timing-function: linear; }
      .agc-glow {
        inset: -34%; border-radius: 50%;
        background: radial-gradient(closest-side,
          color-mix(in srgb, var(--primary, #58a6ff) var(--agc-glow, 22%), transparent),
          color-mix(in srgb, var(--primary, #58a6ff) calc(var(--agc-glow, 22%) / 3), transparent) 55%, transparent);
        animation: agc-glow-in 1.2s cubic-bezier(.16, 1, .3, 1) both, agc-breathe 9s ease-in-out 1.2s infinite;
      }
      @keyframes agc-glow-in { from { opacity: 0; transform: scale(.9); } to { opacity: .8; transform: scale(.97); } }
      @keyframes agc-breathe { 0%, 100% { opacity: .8; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
      .agc-skies { inset: -45%; animation: agc-fade 1.4s ease-out .15s both; }
      .agc-sky { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--text, #e6edf3); opacity: .45; animation: agc-twinkle 4.6s ease-in-out infinite; }
      .agc-sky2 { animation-duration: 6.1s; animation-delay: -2s; }
      .agc-sky3 { animation-duration: 3.7s; animation-delay: -1.1s; }
      @keyframes agc-twinkle { 0%, 100% { opacity: .18; } 50% { opacity: .7; } }
      @keyframes agc-fade { from { opacity: 0; } }
      .agc-far { color: var(--text3, #8b949e); animation: agc-fade .9s ease-out .25s both; }
      .agc-far > svg, .agc-rings > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      /* The landing hero's ring, sized off the mark the way the landing sizes
         it (1.45x) and centred on the world, not the box. The landing's second,
         fainter ring is left out: with the far orbit there, it was one line too
         many around the mark. */
      .agc-rings { animation: agc-fade 1s ease-out .1s both; }
      /* Nothing arrives from nothing: from 94% and clear, on a strong ease-out. */
      .agc-enter { animation: agc-enter .56s cubic-bezier(.16, 1, .3, 1) both; }
      @keyframes agc-enter { from { opacity: 0; transform: scale(.94); } }
      /* Held back so a warm start, over in about a second, never flashes it. */
      .agc-status {
        margin: 0; min-height: 1.45em; max-width: 100%; color: var(--text3, #8b949e);
        text-align: center; animation: agc-fade .4s ease-out .7s both;
      }
      #ag-cover.agc-failed .agc-status { display: none; }
      .agc-error {
        box-sizing: border-box; width: min(440px, 100%); padding: 14px 16px; border-radius: 10px;
        background: var(--bg2, #161b22); border: 1px solid var(--border, #30363d); color: var(--text, #e6edf3);
        font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        -webkit-user-select: text; user-select: text; -webkit-app-region: no-drag;
        box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 1px -.5px rgba(0,0,0,.06), 0 3px 3px -1.5px rgba(0,0,0,.06),
          0 6px 6px -3px rgba(0,0,0,.06), 0 12px 12px -6px rgba(0,0,0,.06), 0 24px 24px -12px rgba(0,0,0,.06);
      }
      .agc-error[hidden], .agc-btn[hidden] { display: none; }
      .agc-err-title { margin: 0; font-size: 13px; font-weight: 600; }
      .agc-err-detail {
        margin: 4px 0 0; max-height: 8.7em; overflow: auto; color: var(--text3, #8b949e);
        font: 11px/1.45 "SF Mono", SFMono-Regular, ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap; overflow-wrap: anywhere;
      }
      .agc-err-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      .agc-btn {
        height: 26px; padding: 0 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--border, #30363d); background: transparent; color: var(--text, #e6edf3);
        font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
        transition: transform .16s ease-out;
      }
      .agc-btn:active { transform: scale(.97); }
      .agc-btn:focus-visible { outline: 2px solid var(--primary, #58a6ff); outline-offset: 2px; }
      .agc-go { background: var(--primary, #58a6ff); border-color: var(--primary, #58a6ff); color: var(--bg, #0d1117); }

      /* On a light theme a glow of the primary reads as a smudge and stars as
         dust: both step back. */
      html.agc-light #ag-cover { --agc-glow: 9%; }
      html.agc-light .agc-sky { fill: var(--text3, #737373); }
      /* Switched off in Settings: the plain boot screen it used to be — the
         mark small and still, one line under it — gone the moment React mounts. */
      html.agc-off #ag-cover { --agc-m: 46px; }
      html.agc-off .agc-glow, html.agc-off .agc-skies, html.agc-off .agc-far, html.agc-off .agc-rings { display: none; }
      html.agc-off #ag-cover * { animation: none !important; }
      html.agc-off .agc-col { gap: 14px; padding-bottom: 16px; }
      /* Reduced motion: the same picture, still. It leaves by a quick cross-fade
         (lib/cover.ts), never by flying. */
      @media (prefers-reduced-motion: reduce) {
        #ag-cover * { animation: none !important; }
      }
    </style>
    <script>
      (function () {
        var doc = document, root = doc.documentElement;
        function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        // THE LAST THEME, BEFORE ANYTHING IS DRAWN. This runs in <head>, ahead
        // of every element in <body>, so the first frame is already in the
        // palette the app will apply a moment later. lib/bootPaint.ts writes
        // it on every paint of a theme; a "system" choice carries both answers
        // and the OS picks between them here, as initialTheme() will.
        var paint = null;
        try { paint = JSON.parse(read("agentglass-boot-paint") || "null"); } catch (e) { paint = null; }
        var pick = paint && paint.v === 1 ? paint : null;
        if (pick && pick.system) {
          var osDark = true;
          try { osDark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { osDark = true; }
          pick = (osDark ? pick.system.dark : pick.system.light) || pick;
        }
        // NOTHING CHOSEN, NOTHING PAINTED: a first run. The app opens it in
        // System, Graphite or Porcelain by the OS (initialTheme in
        // lib/themes.ts), so the cover wears the same rather than the
        // stylesheet's own defaults, which are GitHub Dark's. Only what the
        // cover draws with; the values are those two themes' own, and
        // cover.test.ts holds them to it.
        if (read("agentglass-boot-paint") === null && read("agentglass-theme") === null && read("agentglass-theme-mode") === null) {
          var firstDark = true;
          try { firstDark = matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { firstDark = true; }
          pick = firstDark
            ? { id: "graphite", dark: true, vars: { "--bg": "#1e1e1e", "--bg2": "#262626", "--text": "#fafafa", "--text3": "#a1a1a1", "--border": "#383840", "--primary": "#e5e5e5" } }
            : { id: "porcelain", dark: false, vars: { "--bg": "#ffffff", "--bg2": "#f5f5f5", "--text": "#0a0a0a", "--text3": "#737373", "--border": "#d9d9de", "--primary": "#171717" } };
        }
        if (pick && pick.vars && typeof pick.vars === "object") {
          for (var k in pick.vars) {
            var v = pick.vars[k];
            if (/^--[a-z0-9-]+$/.test(k) && typeof v === "string" && v.length < 160 && !/[;{}<>]/.test(v)) root.style.setProperty(k, v);
          }
          if (typeof pick.id === "string" && pick.id.length < 64) root.setAttribute("data-theme", pick.id);
          if (pick.dark === false) root.classList.add("agc-light");
          var bg = pick.vars["--bg"], meta = doc.querySelector('meta[name="theme-color"]');
          if (meta && typeof bg === "string" && /^#[0-9a-f]{3,8}$/i.test(bg)) meta.setAttribute("content", bg);
        }

        // Up until lib/cover.ts says the app has drawn. Switched off in
        // Settings, it is the plain boot screen and goes the moment React mounts.
        root.classList.add("ag-covering");
        if (read("agentglass-splash") === "off") root.classList.add("agc-off");

        function mounted() { var r = doc.getElementById("root"); return !!(r && r.firstElementChild); }
        function cover() { return root.classList.contains("ag-covering") ? doc.getElementById("ag-cover") : null; }

        // A failure is said here rather than left spinning: this script is the
        // only thing on the page when the bundle is what failed.
        function fail(title, detail) {
          var c = cover(), box = c && c.querySelector(".agc-error");
          if (!box || !box.hidden) return;
          c.classList.add("agc-failed");
          // Nothing under the card can take the focus away from it.
          var app = doc.getElementById("root");
          if (app) app.setAttribute("inert", "");
          box.querySelector(".agc-err-title").textContent = title;
          box.querySelector(".agc-err-detail").textContent = detail;
          var again = box.querySelector('[data-act="reload"]');
          again.onclick = function () { location.reload(); };
          box.hidden = false;
          try { again.focus(); } catch (e) { /* not focusable yet */ }
        }
        addEventListener("error", function (e) {
          if (mounted()) return;
          var t = e.target;
          if (t && t.tagName === "SCRIPT") { fail("The interface did not load", "Its script could not be fetched: " + (t.src || "(inline)")); return; }
          if (t && t !== window) return; // a stylesheet or a picture: not the end of it
          var why = String((e.error && e.error.message) || e.message || "an error stopped it before it drew");
          setTimeout(function () { if (!mounted()) fail("The interface did not load", why); }, 1500);
        }, true);
        // The last word, whatever lib/cover.ts does or fails to do: nothing
        // drew in twenty seconds is a failure, and something that DID draw is
        // never left behind a cover nobody is taking down.
        setTimeout(function () {
          var c = cover();
          if (!c || c.classList.contains("agc-failed")) return;
          if (!mounted()) { fail("The interface did not load", "Nothing had drawn after 20 seconds."); return; }
          root.classList.remove("ag-covering");
          if (c.parentNode) c.parentNode.removeChild(c);
        }, 20000);

        // Report what is actually pending, by asking. The sidecar comes up
        // alongside the window rather than before it, so "waiting for the server"
        // and "waiting for the interface" are different waits and only one of
        // them is usually the answer. Once the app has mounted, lib/cover.ts
        // owns the line and names the panel still loading.
        var origin = (window.agentglass && window.agentglass.apiOrigin) || location.origin;
        var t0 = Date.now();
        // ASK THE SHELL WHEN THERE IS ONE, because asking the network costs an
        // error in the console — the browser logs every refused request, and
        // this poll runs three times a second for as long as the sidecar takes.
        // It was the last console error left at a cold start after the fetch
        // and socket layers stopped asking early. The shell has known the
        // answer since it started the sidecar; `sidecarUp` is that answer, read
        // synchronously over the same bridge `apiOrigin` comes from.
        //
        // The fetch below stays for everything that is not the desktop shell —
        // a phone, a paired browser tab — where there is nothing to ask.
        var askShell = window.agentglass && typeof window.agentglass.sidecarUp === "function"
          ? window.agentglass.sidecarUp
          : null;
        function say(text) {
          var msg = doc.getElementById("agc-msg");
          if (msg && !root.classList.contains("agc-app")) msg.textContent = text;
        }
        function tick() {
          // Gone means the cover came down; "agc-app" means the app took over the line.
          if (!cover() && doc.readyState !== "loading") return;
          if (root.classList.contains("agc-app")) return;
          if (askShell) {
            var up = false;
            try { up = askShell() === true; } catch (e) { up = false; }
            say(up
              ? "loading the interface…"
              : (Date.now() - t0 > 4000 ? "still starting the server…" : "starting the server…"));
            setTimeout(tick, up ? 500 : 300);
            return;
          }
          fetch(origin + "/health", { cache: "no-store" })
            .then(function (r) {
              // Server is up; whatever is left is the bundle still parsing.
              say(r.ok ? "loading the interface…" : "waiting for the server…");
              setTimeout(tick, 500);
            })
            .catch(function () {
              // Only claim something is slow once it has been slow. Before that
              // the honest word is "starting".
              say(Date.now() - t0 > 4000 ? "still starting the server…" : "starting the server…");
              setTimeout(tick, 300);
            });
        }
        setTimeout(tick, 0);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      A sibling of #root, not a child: React's mount replaces whatever is inside
      #root, and the cover has to outlive the mount by the second or so the
      panels take to load.
    -->
    <div id="ag-cover">
      <div class="agc-bg"></div>
      <div class="agc-drag"></div>
      <div class="agc-col">
        <div class="agc-stage">
          <div class="agc-scene agc-glow"></div>
          <div class="agc-scene agc-skies">
            <svg class="agc-sky" viewBox="-28.8 -28.8 121.6 121.6" aria-hidden="true">
              <circle cx="-23.2" cy="-6.4" r=".38"/><circle cx="88" cy="16" r=".26"/><circle cx="-12.8" cy="86.4" r=".26"/>
              <circle cx="64" cy="44.8" r=".22"/><circle cx="100" cy="40" r=".2"/>
            </svg>
            <svg class="agc-sky agc-sky2" viewBox="-28.8 -28.8 121.6 121.6" aria-hidden="true">
              <circle cx="-6.4" cy="-24" r=".29"/><circle cx="81.6" cy="73.6" r=".41"/><circle cx="16" cy="-16" r=".24"/>
              <circle cx="-30" cy="20" r=".2"/>
            </svg>
            <svg class="agc-sky agc-sky3" viewBox="-28.8 -28.8 121.6 121.6" aria-hidden="true">
              <circle cx="76.8" cy="-22.4" r=".36"/><circle cx="51.2" cy="88" r=".29"/><circle cx="-24" cy="54.4" r=".34"/>
              <circle cx="40" cy="-30" r=".18"/><circle cx="70" cy="95" r=".2"/>
            </svg>
          </div>
          <div class="agc-scene agc-far">
          <!-- far:back:start -->
          <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M-2.2 43.1 A36 14 -18 0 1 66.2 20.9" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="1" stroke-dasharray="2 5" vector-effect="non-scaling-stroke"/>
          </svg>
          <span class="agc-far-o agc-far-b">
          <span class="agc-far-arm">
          <span class="agc-far-dot">
          </span>
          </span>
          </span>
          <!-- far:back:end -->
          </div>
          <div class="agc-fx"><div class="agc-fy"><div class="agc-fs">
            <div class="agc-rings">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="30" cy="34" r="46.4" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="1" vector-effect="non-scaling-stroke"/>
              </svg>
            </div>
            <div class="agc-enter">
            <!-- living:start -->
            <span class="ag-lm">
            <svg viewBox="0 0 64 64" aria-hidden="true">
            <path d="M14.1 54.9 A29 8 -52 0 1 49.9 9.1" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="3.2" stroke-linecap="round"/>
            </svg>
            <span class="ag-lm-o ag-lm-b">
            <span class="ag-lm-arm">
            <span class="ag-lm-dot">
            </span>
            </span>
            </span>
            <svg viewBox="0 0 64 64" aria-hidden="true">
            <defs>
            <radialGradient id="agc-sheen" cx=".34" cy=".28" r=".82">
            <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
            <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
            </defs>
            <circle cx="30" cy="34" r="12.5" fill="currentColor"/>
            <circle cx="30" cy="34" r="12.5" fill="url(#agc-sheen)"/>
            <g fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.1">
            <ellipse cx="30" cy="34" rx="12.5" ry="4.5"/>
            <ellipse cx="30" cy="34" rx="6" ry="12.1"/>
            </g>
            <path d="M30 21.5 A12.5 12.5 0 0 1 30 46.5 A17.0 17.0 0 0 0 30 21.5 Z" fill="#1b0b38" fill-opacity=".42"/>
            <path d="M49.9 9.1 A29 8 -52 0 1 14.1 54.9" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
            </svg>
            <span class="ag-lm-o ag-lm-f">
            <span class="ag-lm-arm">
            <span class="ag-lm-dot">
            </span>
            </span>
            </span>
            </span>
            <!-- living:end -->
            </div>
          </div></div></div>
          <div class="agc-scene agc-far">
          <!-- far:front:start -->
          <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M66.2 20.9 A36 14 -18 0 1 -2.2 43.1" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="1" stroke-dasharray="2 5" vector-effect="non-scaling-stroke"/>
          </svg>
          <span class="agc-far-o agc-far-f">
          <span class="agc-far-arm">
          <span class="agc-far-dot">
          </span>
          </span>
          </span>
          <!-- far:front:end -->
          </div>
        </div>
        <p class="agc-status" role="status"><span id="agc-msg">starting…</span></p>
        <div class="agc-error" role="alert" hidden>
          <p class="agc-err-title"></p>
          <p class="agc-err-detail"></p>
          <div class="agc-err-acts">
            <button type="button" class="agc-btn" data-act="continue" hidden>Open the app anyway</button>
            <button type="button" class="agc-btn agc-go" data-act="reload">Reload</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
