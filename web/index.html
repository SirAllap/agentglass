<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentglass</title>
    <meta name="description" content="Every AI coding agent on your machine, on one screen — live cost, tokens and tool calls across every provider, and a hold on anything dangerous until you say go. From your desk or your phone." />
    <!--
      Relative, not absolute. The demo build is served from
      /agentglass/demo/, and `/favicon.svg` there resolves to the host root
      and 404s — the manifest link two lines down already got this right.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      Installable on a phone.

      The remote-access flow ends with someone scanning a QR code, and a link
      opened from a camera lands in a browser tab that they will lose. With a
      manifest the same page can be added to the home screen and opens
      standalone, which is what makes it a companion rather than a bookmark —
      and `theme_color` is what stops iOS drawing a white status bar over a
      dark UI. `start_url` is relative on purpose: the token is stripped from
      the URL on first load and kept in storage, so the installed copy must
      resolve against whatever host it was installed from, not a baked-in one.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#17181b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="agentglass" />
    <!--
      A PNG, because iOS does not support SVG here at all. It ignored the tag,
      fell back to a screenshot of the page, and the home-screen icon was a
      shrunken dashboard — on the one platform where Add to Home Screen is not
      optional, since it is the only way an iPhone gets Web Push.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!--
      What fills the window before React does.

      The bundle is ~1.8 MB of JS and CSS that has to arrive, parse and execute
      before a single pixel is drawn, and `<div id="root"></div>` paints as
      nothing — so the app opened onto a black rectangle and looked like it had
      failed to start. This is markup, not an app: no imports, no framework and
      no request of its own, so it is on screen in the first frame.

      It also tells the truth rather than spinning decoratively. The sidecar is
      started in parallel with the window (see electron/main.js), so at this
      point it may not be answering yet — the script below asks /health and says
      which of the two things is actually pending. No progress bar: nothing here
      can measure progress honestly, and a bar that stalls at 90% is worse than
      no bar at all.

      React replaces all of it: createRoot().render() clears #root on mount.
    -->
    <style>
      #ag-boot {
        position: fixed; inset: 0; display: flex; gap: 14px;
        flex-direction: column; align-items: center; justify-content: center;
        background: #17181b; color: #b6b7bd;
        font-family: "SF Mono", SFMono-Regular, ui-monospace, "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace;
        -webkit-user-select: none; user-select: none;
      }
      #ag-boot .ag-mark { width: 46px; height: 46px; }
      #ag-boot .ag-name { font-size: 13px; letter-spacing: .14em; color: #c9ccd1; }
      #ag-boot .ag-status {
        font-size: 11px; color: #6e7076; min-height: 14px;
        display: flex; align-items: center; gap: 7px;
      }
      /* Delayed on purpose: a warm start is over in about a second, and a
         spinner that appears and vanishes in that time reads as a flicker.
         This one only becomes visible if the wait is long enough to notice. */
      #ag-boot .ag-spin {
        width: 9px; height: 9px; border-radius: 50%;
        border: 1.5px solid rgba(180,181,189,.22); border-top-color: #b6b7bd;
        opacity: 0; animation: ag-fade .2s linear .45s forwards, ag-spin .7s linear .45s infinite;
      }
      @keyframes ag-spin { to { transform: rotate(360deg); } }
      @keyframes ag-fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #ag-boot .ag-spin { animation: ag-fade .2s linear .45s forwards; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ag-boot">
        <!-- logo:start -->
        <svg class="ag-mark" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
          <radialGradient id="boot" cx=".34" cy=".28" r=".82">
          <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          </defs>
          <path d="M14.1 54.9 A29 8 -52 0 1 49.9 9.1" fill="none" stroke="#b6b7bd" stroke-opacity=".4" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="30" cy="34" r="12.5" fill="#b6b7bd"/>
          <circle cx="30" cy="34" r="12.5" fill="url(#boot)"/>
          <g fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.1">
          <ellipse cx="30" cy="34" rx="12.5" ry="4.5"/>
          <ellipse cx="30" cy="34" rx="6" ry="12.1"/>
          </g>
          <path d="M30 21.5 A12.5 12.5 0 0 1 30 46.5 A17.0 17.0 0 0 0 30 21.5 Z" fill="#101114" fill-opacity=".42"/>
          <path d="M49.9 9.1 A29 8 -52 0 1 14.1 54.9" fill="none" stroke="#b6b7bd" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="50.8" cy="10.7" r="6.8" fill="#8d8e95" fill-opacity=".18"/>
          <circle cx="50.8" cy="10.7" r="3.6" fill="#8d8e95"/>
        </svg>
        <!-- logo:end -->
        <div class="ag-name">agentglass</div>
        <div class="ag-status"><span class="ag-spin"></span><span id="ag-boot-msg">starting…</span></div>
      </div>
    </div>
    <script>
      // Report what is actually pending, by asking. The sidecar comes up
      // alongside the window rather than before it, so "waiting for the server"
      // and "waiting for the interface" are different waits and only one of
      // them is usually the answer.
      (function () {
        var msg = document.getElementById("ag-boot-msg");
        if (!msg) return;
        var origin = (window.agentglass && window.agentglass.apiOrigin) || location.origin;
        var t0 = Date.now();
        function tick() {
          // Gone means React mounted and this whole subtree was replaced.
          if (!document.getElementById("ag-boot")) return;
          fetch(origin + "/health", { cache: "no-store" })
            .then(function (r) {
              if (!document.getElementById("ag-boot")) return;
              // Server is up; whatever is left is the bundle still parsing.
              msg.textContent = r.ok ? "loading the interface…" : "waiting for the server…";
              setTimeout(tick, 500);
            })
            .catch(function () {
              if (!document.getElementById("ag-boot")) return;
              // Only claim something is slow once it has been slow. Before that
              // the honest word is "starting".
              msg.textContent = Date.now() - t0 > 4000 ? "still starting the server…" : "starting the server…";
              setTimeout(tick, 300);
            });
        }
        tick();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
