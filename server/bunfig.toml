# Every suite here opens scratch directories under /tmp and almost none of them
# remove one. See test/tmpsweep.ts for what that cost and why the cleanup lives
# in a preload rather than in 182 `afterAll`s. test/envscope.ts does the same for
# the AGENTGLASS_* variables a file leaves behind.
[test]
preload = ["./test/isolation.ts", "./test/tmuxleak.ts", "./test/tmpsweep.ts", "./test/envscope.ts"]
