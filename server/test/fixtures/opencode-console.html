<!doctype html>
<!-- Invented console: never captured from the site. Numbers, plan and copy are
     made up; the shapes (a header, then a value line, then a reset line) are
     what the parser is pinned to. -->
<html lang="en">
<head><meta charset="utf-8"><title>Workspace · Go</title>
<style>.meter{width:100%}</style></head>
<body>
  <nav><a href="/workspace">Workspace</a> <a href="/console/keys">API keys</a></nav>
  <main>
    <h1>acme<span>&nbsp;</span>orbit</h1>
    <p>Go plan</p>
    <section aria-labelledby="five">
      <h2 id="five">5-hour window</h2>
      <p><span class="meter">4%</span> used</p>
      <p>Resets in 3h 41m</p>
    </section>
    <section aria-labelledby="week">
      <h2 id="week">Weekly</h2>
      <p><span class="meter">1%</span> used</p>
      <p>Resets in 1d 10h</p>
    </section>
    <section aria-labelledby="month">
      <h2 id="month">Monthly</h2>
      <p><span class="meter">1%</span> used</p>
      <p>Resets in 29d 22h</p>
    </section>
    <p>Limits &amp; resets are local to this workspace.</p>
  </main>
</body>
</html>
